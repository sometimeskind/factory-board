[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-board"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.9,<4",
    "psycopg-pool>=3.3.3,<4",
    "pydantic>=2.14.4,<3",
    "fastmcp>=4.1.4,<5",
    "py-key-value-aio[postgresql]>=0.4.6,<1",
    "asyncpg>=0.32.0,<1",
    "cryptography>=50.0.2",
    "prometheus-client>=0.26.0,<1",
]

[project.scripts]
factory-board = "factory_board.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["factory_board*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["factory_board", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
