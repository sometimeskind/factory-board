name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pyright
        run: pyright

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # The major the shared CNPG cluster runs (homelab kubernetes/postgres/).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: board_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # The superuser: the fixtures create the roles from dev/roles.sql with it, then run
      # the migrations as board_owner and the store as board_app.
      FACTORY_BOARD_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/board_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -e .

      - name: Run tests
        run: pytest

  build-and-check:
    name: Build, Image Check & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: board_image
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/factory-board
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: prod
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag image for the checks
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: docker tag "$IMAGE_ID" factory-board:ci-local

      - name: Image check — runs as non-root
        run: test "$(docker run --rm factory-board:ci-local id -u)" = 65532

      # The migrations never create roles, so the superuser makes them first (dev/roles.sql,
      # which also gives the database to board_owner). The image then migrates as board_owner.
      - name: Create the roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec -i "$POSTGRES_CONTAINER"
          psql -q -v ON_ERROR_STOP=1 -U postgres -d board_image < dev/roles.sql

      - name: Image check — the shipped migrations apply as board_owner, twice
        env:
          FACTORY_BOARD_MIGRATE_DATABASE_URL: postgresql://board_owner:board_owner@localhost:5432/board_image
        run: |
          docker run --rm --network host --read-only -e FACTORY_BOARD_MIGRATE_DATABASE_URL factory-board:ci-local
          docker run --rm --network host --read-only -e FACTORY_BOARD_MIGRATE_DATABASE_URL factory-board:ci-local
